<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>بانک مرکزی جمهوری اسلامی ایران</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
:root{--header:#4a4a4a;--search:#1a4d73;--brand:#e85d1c;--sky:#2c8fc4;--foot:#3f3f3f;--ink:#333;--muted:#6b6b6b;--line:#d4d4d4;--bg:#f4f4f4;--danger:#8f3a3a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}
.search{background:var(--search);color:#fff;display:flex;align-items:center;gap:8px;padding:6px 10px;direction:ltr}
.search .en{background:#111;padding:8px 12px;font-size:12px}
.search input{flex:1;background:transparent;border:0;color:#fff;text-align:right;direction:rtl;outline:none}
.top{background:var(--header);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
.top h1{margin:0;font-size:16px;font-weight:500}
.icon-btn{width:42px;height:42px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff}
.staffbar{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:4px 8px;font-size:12px}
.staffbar button,.staffbar span{border:0;background:none;padding:8px;white-space:nowrap}
.staffbar .out{color:var(--danger);margin-right:auto}
.hero{background:#555;color:#fff}.rel{position:relative}
.hero-cap{padding:22px 18px 10px;text-align:center;font-size:17px;line-height:1.8}
.date-badge{position:absolute;left:12px;bottom:12px;background:#111;color:#fff;font-size:12px;padding:4px 8px}
.date-badge span{color:var(--brand)}
.news{background:#fff;position:relative}.tag{position:absolute;right:0;top:0;background:var(--brand);color:#fff;padding:6px 12px;font-size:13px}
.row{display:block;padding:16px;border-bottom:1px solid var(--line)}.kicker{color:var(--muted);font-size:13px}.row p{margin:6px 0 0;font-size:14px;line-height:1.8}
footer{background:var(--foot);color:#d8d8d8}footer .fl{display:block;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.contact-tag{position:absolute;right:16px;top:-10px;background:var(--brand);color:#fff;font-size:12px;padding:4px 10px}
.contact{background:var(--sky);color:#fff;text-align:center;padding:36px 16px 28px;position:relative}
.copy{text-align:center;font-size:12px;padding:16px}
.fab{position:fixed;left:14px;bottom:14px;width:48px;height:48px;background:#fff;border:0;box-shadow:0 6px 18px rgba(0,0,0,.18);font-size:22px}
.menu{display:none;background:var(--header);color:#fff}.menu.open{display:block}
.menu button{width:100%;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.12);color:inherit;text-align:right;padding:14px 16px}
.wrap{max-width:760px;margin:0 auto}.page{padding:20px 16px 80px}
.card{background:#fff;border:1px solid var(--line);padding:18px;margin-bottom:14px}h2{margin:0 0 8px;font-size:18px}
label{display:block;font-size:13px;margin:12px 0 6px}input{width:100%;border:1px solid var(--line);padding:10px}
.btn{background:var(--search);color:#fff;border:0;padding:12px 16px;width:100%;margin-top:14px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.ok{background:#2f6b4f}
.demo{width:100%;text-align:right;border:1px solid var(--line);background:#fff;padding:10px;margin-top:8px;display:flex;justify-content:space-between}
.badge{display:inline-block;font-size:11px;padding:2px 8px;background:#f6efd9;color:#8a6a28}
.step{border-right:3px solid #d4d4d4;padding:10px 14px;margin:8px 8px 8px 0}.step.done{border-right-color:#2f6b4f}.step.now{border-right-color:var(--brand);background:#fff6ef}
.hidden{display:none!important}.grid{display:grid;gap:8px}
</style></head><body>
<div class="search"><span class="en">English</span><input id="q" placeholder="جست و جو برای ..."/></div>
<div class="top"><h1>بانک مرکزی جمهوری اسلامی ایران</h1><button class="icon-btn" id="menuBtn">☰</button></div>
<div class="staffbar hidden" id="staffbar">
<button data-go="dash">داشبورد</button><button data-go="unblocks">رفع مسدودی</button><button data-go="process">بررسی فرآیند</button><button data-go="inq">استعلام</button>
<span id="who"></span><button class="out" id="logout">خروج</button></div>
<div class="menu" id="menu"><button data-go="login" id="deskLink">میز خدمت بانک مرکزی</button></div>
<div id="app"></div>
<footer>
<a class="fl" data-go="home">همه خبرها</a><a class="fl" data-go="process">بررسی فرآیند رفع مسدودی</a>
<div class="contact"><div class="contact-tag">اطلاعات تماس</div><div>بانک مرکزی جمهوری اسلامی ایران</div><div>تهران - بلوار میرداماد - شماره ۱۹۸</div><div>مرکز تلفن : ۲۹۹۵۰۰۰۰</div></div>
<div class="copy">نسخه داخلی میز خدمت — برای باز شدن در سافاری</div></footer>
<button class="fab">♿</button>
<script src="app.js"></script>
</body></html>
